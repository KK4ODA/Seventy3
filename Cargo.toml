[package]
name = "seventy3"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Panadapter, waterfall and CAT control for the Kenwood TS-480, fed by an RTL-SDR on the rig's first IF"
repository = "https://github.com/KK4ODA/Seventy3"
readme = "README.md"
publish = false

[dependencies]
# UI. wgpu (Direct3D 12 on Windows) is the default renderer; glow (OpenGL) is
# compiled in as a fallback for machines whose graphics driver rejects wgpu.
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
egui_extras = "0.37"
# Pure-Rust RTL-SDR driver (talks to WinUSB directly; no librtlsdr DLL to ship).
rtl-sdr-rs = "0.4.3"
# CAT. No libudev on Linux; we only need to open ports and list their names.
serialport = { version = "4.10", default-features = false }
rustfft = "6.4"
# POTA spots. platform-verifier trusts the Windows certificate store.
ureq = { version = "3.5", features = ["platform-verifier"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
log = "0.4"
png = "0.18"

[profile.dev]
opt-level = 1

# DSP-heavy dependencies are unusably slow unoptimized, even while developing.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# Unwinding (the default) is relied on: dropping the rig handle on a panic
# sends RX; so a crash never leaves the transmitter keyed.
panic = "unwind"
